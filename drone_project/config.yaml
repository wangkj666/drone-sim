# 无人机自主栖息与抓取 — 全局配置

drone:
  mass: 1.5           # kg, F570含电池实测
  arm_length: 0.285   # m, 轴距570mm
  frame_height: 0.04  # m, 碳纤中心板3mm+设备
  frame_width: 0.20   # m, 中心板宽
  frame_length: 0.22  # m, 中心板长
  motor_dia: 0.028    # m, 2212电机
  motor_height: 0.025 # m
  prop_length: 0.254  # m, 1045桨(10寸)
  prop_width: 0.025   # m
  init_position: [0, 0, 0.5]  # 从地面起飞（运动学模式不受地面接触影响）

control:
  # "pid" 为验证基线；确认闭环悬停后可改为 "mpc"
  outer_loop: "pid"
  # 外环：位置 PID — kp/ki/kd 分别为 [x, y, z]
  pos_pid:
    kp: [1.0, 1.0, 3.0]
    ki: [0.05, 0.05, 0.3]
    kd: [0.8, 0.8, 2.0]
    integral_max: 5.0

  # 内环：姿态 PID — kp/ki/kd 分别为 [roll, pitch, yaw]
  att_pid:
    kp: [5.0, 5.0, 2.0]
    ki: [0.01, 0.01, 0.01]
    kd: [1.0, 1.0, 0.5]
    integral_max: 1.0

  max_tilt: 0.5          # rad
  max_xy_accel: 4.0      # m/s^2, 限制水平指令以避免大倾角突变
  max_z_accel: 5.0       # m/s^2, 限制垂直加速度指令

  # MPC 只替换位置外环，姿态内环和混控器继续使用 PID。
  mpc:
    horizon: 12
    update_period: 4     # 每 4 个物理步求解一次，其他步保持上一条加速度指令
    position_weight: [12.0, 12.0, 18.0]
    velocity_weight: [3.0, 3.0, 4.0]
    control_weight: [0.3, 0.3, 0.5]
  max_thrust: 50.0       # N
  min_thrust: 0.0        # N
  thrust_to_torque: 0.05
  mixer_type: "x"

sensors:
  camera:
    width: 640
    height: 480
    fps: 30
    fov: 90
  imu:
    freq: 100
  depth:
    enabled: true

target:
  use_aruco: true
  aruco_id: 42
  aruco_size: 0.1
  object_height: 1.0
  approach_distance: 0.5
  hover_height: 2.0

sim:
  physics_dt: 0.00833    # 120Hz (更精细的物理步长)
  headless: false
  gravity: 9.81
